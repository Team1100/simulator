	<head>

    	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<style type="text/css">
body {
	margin: 0;
	background-color: black;
}

.main {
	position: absolute;
	top: 0px;
	left: 0px;
	width: 100%;
	height: 100%;

	margin: 0px;
	border: 0;

	overflow: hidden;
	display: block;
    image-rendering: crisp-edges;
}
		</style>
	</head>
	<body>
		<canvas class="main" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
		<script type="text/javascript">
			var Module = {
				preRun: [],
				print: (...args) => console.log('[stdout]: ' + args.join(' ')),
				printErr: (...args) => console.log('[stderr]: ' + args.join(' ')),
			};
			window.onerror = (event) => console.log('[onerror]: ' + event.message);
		</script>
